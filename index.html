<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M/S, M.K. Leather</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#d4a017;--g2:#f3c94a;--br:#8b4a2b;--k:#0a0a0a;--bg:#f5f3f0}
body{font-family:"Noto Sans Bengali",system-ui,sans-serif;background:var(--bg);color:#222;padding-bottom:70px}
header{background:var(--k);position:sticky;top:0;z-index:5;padding:8px 12px;border-bottom:2px solid var(--g)}
.top{display:flex;align-items:center;gap:10px}
.top img{width:46px;height:46px;border-radius:50%}
.top input{flex:1;padding:10px 14px;border-radius:20px;border:0;font-size:14px;min-width:0}
.hero{margin:12px;border-radius:14px;padding:22px 16px;background:linear-gradient(135deg,#000,#4a2512);color:var(--g2);text-align:center;border:1px solid var(--g)}
.hero h1{font-size:22px;margin-bottom:6px}.hero p{color:#e8d9b5;font-size:13px}
#cats{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 8px}
.chip{padding:7px 14px;border-radius:18px;background:#fff;border:1px solid #ddd;font-size:13px;white-space:nowrap;cursor:pointer;display:inline-block;margin:0 6px 6px 0}
#cats .chip{margin:0}
.chip.on{background:var(--k);color:var(--g2);border-color:var(--k)}
h2.t{padding:6px 14px;font-size:17px}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.card{background:#fff;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #e6e0d8}
.im{height:130px;display:flex;align-items:center;justify-content:center;font-size:56px;background:linear-gradient(135deg,#3a2012,var(--br))}
.im img{width:100%;height:100%;object-fit:cover}.im.big{height:180px;font-size:80px;border-radius:10px;margin-bottom:10px}
.in{padding:8px 10px 10px}.nm{font-size:13px;height:36px;overflow:hidden}
.pr{color:var(--br);font-size:16px}s{color:#999;font-size:12px}.off{background:#fde8c4;color:#a35a00;font-size:11px;padding:1px 5px;border-radius:4px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--k);display:flex;border-top:2px solid var(--g);z-index:5}
nav a{flex:1;text-align:center;padding:9px 0;color:#bbb;font-size:11px;position:relative;cursor:pointer}
nav a b{display:block;font-size:20px}nav a.on{color:var(--g2)}
.bd{position:absolute;top:2px;left:55%;background:#e11;color:#fff;font-size:10px;border-radius:9px;padding:1px 5px}
#ov{display:none;position:fixed;inset:0;background:var(--bg);z-index:10}
#mb{background:var(--bg);width:100%;height:100%;overflow:auto;padding:60px max(16px,calc((100% - 640px)/2)) 90px;position:relative}
.x{position:fixed;right:12px;top:10px;z-index:11;border:0;background:var(--k);color:var(--g2);border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer}
#mb h3{margin:0 0 12px;font-size:20px}.lb{font-size:13px;color:#666;margin:10px 0 6px}
.care{flex:none;border:0;background:var(--g);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
.ci{display:flex;gap:12px;background:#fff;border-radius:12px;border:1px solid #e6e0d8;padding:10px;margin-bottom:10px}
.ci .th{width:96px;height:96px;flex:none;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(135deg,#3a2012,var(--br))}
.ci .th img{width:100%;height:100%;object-fit:cover}
.ci .inf{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.q button.rm{border:0;background:none;font-size:16px;width:auto}
.sum{background:#fff;border-radius:12px;border:1px solid #e6e0d8;padding:4px 12px;margin-top:6px}
.oc{background:#fff;border-radius:12px;border:1px solid #e6e0d8;padding:12px;margin-bottom:10px;font-size:14px}
.stp{display:flex;margin:12px 0 4px}
.stp div{flex:1;text-align:center;font-size:11px;color:#999}
.stp i{display:block;width:20px;height:20px;border-radius:50%;background:#ddd;margin:0 auto 4px;line-height:20px;font-size:12px;font-style:normal;color:#fff}
.stp div.d{color:#087f23}.stp div.d i{background:#087f23}
.msgs{display:flex;flex-direction:column;gap:6px}
.bb{max-width:78%;padding:8px 12px;border-radius:14px;font-size:14px;word-break:break-word}
.bb.me{align-self:flex-end;background:var(--k);color:var(--g2)}.bb.ad{align-self:flex-start;background:#fff;border:1px solid #e6e0d8}
.cin{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:8px 12px;display:flex;gap:8px;border-top:1px solid #ddd;z-index:11}
.cin input{flex:1;min-width:0;padding:11px 14px;border:1px solid #ccc;border-radius:20px;font-size:14px;font-family:inherit}
.cin button{border:0;background:var(--g);border-radius:20px;padding:0 18px;font-weight:600;cursor:pointer}
input.f,select.f,textarea.f{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:14px;margin-bottom:8px;font-family:inherit}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:8px;font-size:15px;font-weight:600;margin-top:8px;cursor:pointer;background:var(--k);color:var(--g2)}
.btn.g{background:var(--g);color:#000}.btn.w{background:#fff;color:#222;border:1px solid #ccc}
.er{color:#c00;font-size:13px;min-height:18px;margin:4px 0}.ok{color:#087f23;font-size:13px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
.q button{width:28px;height:28px;border:1px solid #ccc;background:#fff;border-radius:6px}
.pay{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:6px;font-size:14px}
a.lk{color:var(--br);font-size:13px;cursor:pointer;text-decoration:underline}
</style></head><body>

function thumb(i){const x=P.find(a=>a.id==i.id)||{};return x.img?`<img src="${x.img}">`:(x.e||'👜')}
function cartM(){const t=cart.reduce((s,i)=>s+i.p*i.qty,0);
M(`<h3>আপনার কার্ট</h3>`+(cart.length?cart.map((i,k)=>`<div class="ci"><div class="th">${thumb(i)}</div><div class="inf"><div><div style="font-size:14px">${i.n}</div><small style="color:#666">${i.col}${i.sz?' · সাইজ '+bn(i.sz):''}</small></div><div class="row" style="border:0;padding:0"><b class="pr">৳${bn(i.p*i.qty)}</b><div class="q"><button onclick="cq(${k},-1)">−</button> ${bn(i.qty)} <button onclick="cq(${k},1)">+</button> <button class="rm" onclick="cq(${k},-99)">🗑</button></div></div></div></div>`).join('')+`<div class="sum"><p class="row" style="border:0"><b>মোট</b><b>৳${bn(t)}</b></p></div><button class="btn g" onclick="checkout(cart,1)">অর্ডার করুন</button>`:`<p class="lb">কার্ট খালি। পছন্দের পণ্য বেছে নিন।</p><button class="btn" onclick="closeM()">শপিং করুন</button>`))}
function cq(k,d){cart[k].qty+=d;if(cart[k].qty<1)cart.splice(k,1);save();cartM()}

function checkout(items,fromCart){if(!user){pend=()=>checkout(items,fromCart);authM('login','অর্ডার করতে আগে লগইন করুন।');return}
const t=items.reduce((s,i)=>s+i.p*i.qty,0),p=prof||{};
M(`<h3>ডেলিভারির ঠিকানা</h3>
<input class="f" id="cn1" placeholder="আপনার নাম" value="${p.name||user.displayName||''}">
<input class="f" id="cp" type="tel" placeholder="মোবাইল / হোয়াটসঅ্যাপ নম্বর" value="${p.whatsapp||''}">
<select class="f" id="cd" onchange="tot(${t})"><option value="">জেলা বাছুন</option>${D.map(d=>`<option>${d}</option>`).join('')}</select>
<input class="f" id="cu" placeholder="থানা / উপজেলা">
<textarea class="f" id="ca" rows="2" placeholder="পূর্ণ ঠিকানা (বাসা, রাস্তা, এলাকা)"></textarea>
<p class="lb">পেমেন্ট পদ্ধতি</p>
<label class="pay"><input type="radio" name="pay" value="cod" checked onchange="pay(this.value)"> ক্যাশ অন ডেলিভারি</label>
<label class="pay"><input type="radio" name="pay" value="bkash" onchange="pay(this.value)"> বিকাশ</label>
<label class="pay"><input type="radio" name="pay" value="nagad" onchange="pay(this.value)"> নগদ</label>
<p class="er" id="pm"></p>
<div class="row"><span>পণ্যের দাম</span><span>৳${bn(t)}</span></div><div class="row"><span>ডেলিভারি চার্জ</span><span id="dc">জেলা বাছুন</span></div><div class="row"><b>সর্বমোট</b><b id="tt">৳${bn(t)}</b></div>
<p class="er" id="er"></p><button class="btn g" id="ob">অর্ডার কনফার্ম করুন</button>`);
window._it=items;window._fc=fromCart;$('#ob').onclick=place}
function dch(){const d=$('#cd').value;return d?(d=='ঢাকা'?ST.dhaka:ST.out):0}
function tot(t){const c=dch();$('#dc').textContent='৳'+bn(c);$('#tt').textContent='৳'+bn(t+c)}
function pay(v){if(v!='cod'){$('#pm').textContent='সার্ভারে সমস্যা হচ্ছে। সমস্যা ঠিক হলে আপনাকে অবশ্যই জানানো হবে।';document.querySelector('input[value=cod]').checked=true}else $('#pm').textContent=''}
async function place(){const v=i=>$('#'+i).value.trim(),e=$('#er');
if(!v('cn1')||!v('cp')||!v('cd')||!v('cu')||!v('ca')){e.textContent='সব তথ্য পূরণ করুন।';return}
if(!/^(\+?88)?01\d{9}$/.test(v('cp'))){e.textContent='সঠিক মোবাইল নম্বর দিন (যেমন 01XXXXXXXXX)।';return}
const it=window._it,sub=it.reduce((s,i)=>s+i.p*i.qty,0),dc=dch();$('#ob').disabled=true;e.textContent='';
try{const r=await db.collection('orders').add({uid:user.uid,email:user.email,name:v('cn1'),phone:v('cp'),district:v('cd'),area:v('cu'),address:v('ca'),items:it,subtotal:sub,delivery:dc,total:sub+dc,payment:'cod',status:'নতুন',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
if(window._fc){cart=[];save()}
M(`<h3>অর্ডার সফল হয়েছে ✅</h3><p style="margin:10px 0">ধন্যবাদ ${v('cn1')}! আমরা শীঘ্রই আপনার সাথে যোগাযোগ করব।</p><p>অর্ডার আইডি: <b>${r.id.slice(0,8).toUpperCase()}</b></p><p>সর্বমোট: <b>৳${bn(sub+dc)}</b> (ক্যাশ অন ডেলিভারি)</p><button class="btn g" onclick="ordersM()">আমার অর্ডার দেখুন</button><button class="btn" onclick="closeM()">শপিং চালিয়ে যান</button>`)}
catch(x){e.textContent='অর্ডার হয়নি: '+er(x);$('#ob').disabled=false}}

function authM(v,msg){const T={login:'লগইন',signup:'নতুন অ্যাকাউন্ট',forgot:'পাসওয়ার্ড ভুলে গেছেন?'};let h=`<h3>${T[v]}</h3>${msg?`<p class="lb">${msg}</p>`:''}`;
if(v=='login')h+=`<input class="f" id="em" type="email" placeholder="ইমেইল"><input class="f" id="pw" type="password" placeholder="পাসওয়ার্ড"><p class="er" id="er"></p><button class="btn g" onclick="login()">লগইন</button><p style="margin:10px 0"><a class="lk" onclick="authM('forgot')">পাসওয়ার্ড ভুলে গেছি</a></p><button class="btn w" onclick="google()">🔐 গুগল দিয়ে লগইন</button><button class="btn" onclick="authM('signup')">নতুন অ্যাকাউন্ট খুলুন</button>`;
if(v=='signup')h+=`<input class="f" id="nm" placeholder="আপনার নাম"><input class="f" id="wa" type="tel" placeholder="হোয়াটসঅ্যাপ নম্বর"><input class="f" id="wb" type="tel" placeholder="অন্য একটি হোয়াটসঅ্যাপ নম্বর"><input class="f" id="un" placeholder="ইউজারনেম"><input class="f" id="em" type="email" placeholder="ইমেইল"><input class="f" id="pw" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)"><input class="f" id="pw2" type="password" placeholder="পাসওয়ার্ড আবার দিন"><p class="er" id="er"></p><button class="btn g" onclick="signup()">অ্যাকাউন্ট খুলুন</button><button class="btn w" onclick="google()">🔐 গুগল দিয়ে সাইন আপ</button><p style="margin-top:10px"><a class="lk" onclick="authM('login')">আগে থেকেই অ্যাকাউন্ট আছে? লগইন করুন</a></p>`;
if(v=='forgot')h+=`<p class="lb">আপনার ইমেইল দিন, পাসওয়ার্ড রিসেট করার লিংক পাঠানো হবে।</p><input class="f" id="em" type="email" placeholder="ইমেইল"><p class="er" id="er"></p><button class="btn g" onclick="forgot()">রিসেট লিংক পাঠান</button><p style="margin-top:10px"><a class="lk" onclick="authM('login')">লগইনে ফিরে যান</a></p>`;M(h)}
const g=i=>$('#'+i).value.trim(),err=t=>$('#er').textContent=t;
async function login(){try{await auth.signInWithEmailAndPassword(g('em'),$('#pw').value);closeM()}catch(e){err(er(e))}}
async function signup(){const em=g('em'),pw=$('#pw').value;
if(!g('nm')||!g('wa')||!g('un')||!em||!pw){err('নাম, হোয়াটসঅ্যাপ নম্বর, ইউজারনেম, ইমেইল ও পাসওয়ার্ড দিতে হবে।');return}
if(pw!=$('#pw2').value){err('দুটি পাসওয়ার্ড মিলছে না।');return}
try{const c=await auth.createUserWithEmailAndPassword(em,pw);await c.user.updateProfile({displayName:g('nm')});
await db.collection('users').doc(c.user.uid).set({name:g('nm'),whatsapp:g('wa'),whatsapp2:g('wb'),username:g('un'),email:em,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
prof={name:g('nm'),whatsapp:g('wa')};closeM()}catch(e){err(er(e))}}
async function forgot(){try{await auth.sendPasswordResetEmail(g('em'));$('#er').className='ok';err('রিসেট লিংক ইমেইলে পাঠানো হয়েছে। স্প্যাম ফোল্ডারও দেখুন।')}catch(e){err(er(e))}}
async function google(){try{const r=await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
await db.collection('users').doc(r.user.uid).set({name:r.user.displayName||'',email:r.user.email,createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});closeM()}catch(e){err(er(e))}}
function acc(){if(!user)return authM('login');M(`<h3>মাই অ্যাকাউন্ট</h3><div class="oc"><b>${esc(user.displayName||'')}</b><br><small>${esc(user.email||'')}</small></div><button class="btn g" onclick="ordersM()">📦 আমার অর্ডার</button><button class="btn" onclick="chatM()">💬 চ্যাট</button><button class="btn" onclick="careM()">📞 কাস্টমার কেয়ার</button><button class="btn w" onclick="auth.signOut();closeM()">লগআউট</button>`)}

const STEPS=['নতুন','কনফার্মড','শিপড','ডেলিভারড'];
async function ordersM(){
if(!user){pend=ordersM;authM('login','অর্ডার দেখতে আগে লগইন করুন।');return}
M('<h3>আমার অর্ডার</h3><p class="lb">লোড হচ্ছে...</p>');
try{const s=await db.collection('orders').where('uid','==',user.uid).get();
const l=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?b.createdAt.seconds:0)-(a.createdAt?a.createdAt.seconds:0));
M('<h3>আমার অর্ডার</h3>'+(l.length?l.map(o=>{const k=STEPS.indexOf(o.status),dt=o.createdAt?o.createdAt.toDate().toLocaleDateString('bn-BD'):'';
const stp=o.status=='বাতিল'?'<p class="er">অর্ডারটি বাতিল হয়েছে।</p>':`<div class="stp">${STEPS.map((s,i)=>`<div class="${i<=k?'d':''}"><i>${i<=k?'✓':''}</i>${s}</div>`).join('')}</div>`;
return `<div class="oc"><div class="row" style="border:0;padding:0"><b>#${o.id.slice(0,8).toUpperCase()}</b><small>${dt}</small></div><div style="margin:6px 0;color:#555">${(o.items||[]).map(i=>esc(i.n)+' ×'+bn(i.qty)).join(', ')}</div><div class="row" style="padding:4px 0"><span>সর্বমোট</span><b>৳${bn(o.total||0)}</b></div><div class="row" style="border:0;padding:4px 0"><span>বর্তমান অবস্থা</span><b>${esc(o.status||'')}</b></div>${stp}</div>`}).join(''):'<p class="lb">এখনো কোনো অর্ডার নেই।</p>'))}
catch(e){M('<h3>আমার অর্ডার</h3><p class="er">'+er(e)+'</p>')}}

function chatM(){
if(!user){pend=chatM;authM('login','চ্যাট করতে আগে লগইন করুন।');return}
M(`<h3>চ্যাট</h3><p class="lb">আমাদের সাথে সরাসরি কথা বলুন। যত দ্রুত সম্ভব উত্তর দেওয়া হবে।</p><div class="msgs" id="ms"></div><div class="cin"><input id="ci" placeholder="মেসেজ লিখুন..." onkeydown="if(event.key=='Enter')sendC()"><button onclick="sendC()">পাঠান</button></div>`);
unsub=db.collection('chats').doc(user.uid).collection('messages').orderBy('createdAt').onSnapshot(s=>{const m=$('#ms');if(!m)return;
m.innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="bb ${x.from=='admin'?'ad':'me'}">${esc(x.text)}</div>`}).join('')||'<p class="lb">এখনো কোনো মেসেজ নেই।</p>';
$('#mb').scrollTop=$('#mb').scrollHeight},e=>{const m=$('#ms');if(m)m.innerHTML='<p class="er">'+er(e)+'</p>'})}
async function sendC(){const i=$('#ci'),t=i.value.trim();if(!t)return;i.value='';
try{const c=db.collection('chats').doc(user.uid),ts=firebase.firestore.FieldValue.serverTimestamp();
await c.collection('messages').add({text:t,from:'user',createdAt:ts});
await c.set({uid:user.uid,name:(prof&&prof.name)||user.displayName||'',email:user.email||'',last:t,updatedAt:ts,unread:true},{merge:true})}
catch(e){$('#ms').insertAdjacentHTML('beforeend','<p class="er">পাঠানো যায়নি: '+er(e)+'</p>')}}

function careM(){const ph=(ST.phone||'').trim(),w=(ST.wa||ST.phone||'').replace(/\D/g,''),wn=w.startsWith('88')?w:'88'+w;
M(`<h3>কাস্টমার কেয়ার</h3><p class="lb">যেকোনো সমস্যা বা প্রশ্নে আমাদের সাথে যোগাযোগ করুন।</p>`+(ph?`<a class="btn g" style="text-decoration:none;text-align:center" href="tel:${ph}">📞 কল করুন (${bn(ph)})</a>`:'')+(w?`<a class="btn" style="text-decoration:none;text-align:center" href="https://wa.me/${wn}" target="_blank" rel="noopener">💬 হোয়াটসঅ্যাপে মেসেজ করুন</a>`:'')+`<button class="btn w" onclick="chatM()">💬 সরাসরি চ্যাট করুন</button>`+(ph||w?'':'<p class="lb">ফোন নম্বর শীঘ্রই যোগ করা হবে। এখন চ্যাটে মেসেজ দিন।</p>'))}
async function loadP(){try{const s=await db.collection('products').get(),l=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.active!==false);
if(l.length)P=l.sort((a,b)=>(b.t||0)-(a.t||0));
const t=await db.collection('settings').doc('site').get();if(t.exists){ST={...ST,...t.data()};$('.hero h1').textContent=ST.title;$('.hero p').textContent=ST.sub}}catch(e){console.error(e)}render()}
render();ui();if(db)loadP();
</script></body></html>
