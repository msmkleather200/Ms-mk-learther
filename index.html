<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M/S, M.K. Leather</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#d4a017;--g2:#f3c94a;--br:#8b4a2b;--k:#0a0a0a;--bg:#f5f3f0}
body{font-family:"Noto Sans Bengali",system-ui,sans-serif;background:var(--bg);color:#222;padding-bottom:70px}
header{background:var(--k);position:sticky;top:0;z-index:5;padding:8px 12px;border-bottom:2px solid var(--g)}
.top{display:flex;align-items:center;gap:10px}
.top img{width:46px;height:46px;border-radius:50%}
.top input{flex:1;padding:10px 14px;border-radius:20px;border:0;font-size:14px;min-width:0}
.hero{margin:12px;border-radius:14px;padding:22px 16px;background:linear-gradient(135deg,#000,#4a2512);color:var(--g2);text-align:center;border:1px solid var(--g)}
.hero h1{font-size:22px;margin-bottom:6px}.hero p{color:#e8d9b5;font-size:13px}
#cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 10px}
.chip{padding:7px 14px;border-radius:18px;background:#fff;border:1px solid #ddd;font-size:13px;white-space:nowrap;cursor:pointer;display:inline-block;margin:0 6px 6px 0}
#cats .chip{margin:0}
.chip.on{background:var(--k);color:var(--g2);border-color:var(--k)}
h2.t{padding:6px 14px;font-size:17px}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.card{background:#fff;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #e6e0d8}
.im{height:130px;display:flex;align-items:center;justify-content:center;font-size:56px;background:linear-gradient(135deg,#3a2012,var(--br))}
.im img{width:100%;height:100%;object-fit:cover}.im.big{height:180px;font-size:80px;border-radius:10px;margin-bottom:10px}
.in{padding:8px 10px 10px}.nm{font-size:13px;height:36px;overflow:hidden}
.pr{color:var(--br);font-size:16px}s{color:#999;font-size:12px}.off{background:#fde8c4;color:#a35a00;font-size:11px;padding:1px 5px;border-radius:4px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--k);display:flex;border-top:2px solid var(--g);z-index:5}
nav a{flex:1;text-align:center;padding:8px 0;color:#bbb;font-size:10.5px;position:relative;cursor:pointer}
nav a b{display:block;font-size:19px}nav a.on{color:var(--g2)}
.bd{position:absolute;top:2px;left:52%;background:#e11;color:#fff;font-size:10px;border-radius:9px;padding:1px 5px}
#ov{display:none;position:fixed;inset:0;background:#fff;z-index:10}
#mb{background:#fff;width:100%;height:100%;overflow:auto;padding:60px max(16px,calc((100% - 640px)/2)) 100px;position:relative;-webkit-overflow-scrolling:touch}
.x{position:fixed;right:12px;top:10px;border:0;background:#eee;border-radius:50%;width:38px;height:38px;font-size:17px;z-index:12;cursor:pointer}
#mb h3{margin:0 30px 6px 0}.lb{font-size:13px;color:#666;margin:10px 0 6px}
input.f,select.f,textarea.f{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:14px;margin-bottom:8px;font-family:inherit}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:8px;font-size:15px;font-weight:600;margin-top:8px;cursor:pointer;background:var(--k);color:var(--g2)}
.btn.g{background:var(--g);color:#000}.btn.w{background:#fff;color:#222;border:1px solid #ccc}
.er{color:#c00;font-size:13px;min-height:18px;margin:4px 0}.ok{color:#087f23;font-size:13px}
